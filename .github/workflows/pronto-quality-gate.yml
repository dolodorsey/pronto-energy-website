name: Pronto Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pronto-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Pronto release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Locked dependency install
        run: npm ci

      - name: Verify Pronto isolation
        run: npm run verify:isolation

      - name: Verify Pronto security floor
        run: npm run verify:security

      - name: Verify Pronto intake resilience
        run: npm run verify:intake

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
