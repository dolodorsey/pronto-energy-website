name: Pronto UI Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Pronto CRM isolation contract
        run: |
          grep -q "PRONTO_GHL_LOCATION_ID = 'ASE7kn1Ee87Oxb7VJSei'" src/app/api/forms/route.js
          if grep -q "P3Xk1DXrNRFozNsGQeJ8" src/app/api/forms/route.js; then
            echo "BEVCO GHL location leaked into Pronto intake code"
            exit 1
          fi
      - name: Remediate production dependency advisories
        run: npm audit fix
      - name: Persist dependency remediation on Pronto branch
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Remediate Pronto production dependencies"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
