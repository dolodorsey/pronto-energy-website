name: Pronto UI Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Pronto CRM isolation contract
        run: |
          grep -q "PRONTO_GHL_LOCATION_ID = 'ASE7kn1Ee87Oxb7VJSei'" src/app/api/forms/route.js
          if grep -q "P3Xk1DXrNRFozNsGQeJ8" src/app/api/forms/route.js; then
            echo "BEVCO GHL location leaked into Pronto intake code"
            exit 1
          fi
      - name: Remediate production dependency advisories
        run: npm audit fix
      - name: Export remediated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pronto-remediated-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
